<!doctype html>
<html lang="en" data-phase="start" data-reduced-motion="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0620">
  <title>Hollow Hill</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Start screen: scene stays hidden until Enter is pressed -->
  <main id="start" class="start">
    <p class="start-kicker">Virtual Hallo&rsquo;weenie</p>
    <h1 class="start-title">Hollow Hill</h1>
    <p class="start-note">Best with sound on.</p>
    <button id="enter" class="btn btn-primary" type="button">Enter</button>
    <p id="motion-note" class="start-note" hidden>Reduced motion is on.</p>
  </main>

  <!-- Stage: one fixed 9:16 box; the SVG scales inside it, UI sits on top at fixed text size -->
  <div id="stage" class="stage" hidden tabindex="-1">

    <svg id="scene" class="scene" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid meet"
         role="group" aria-label="Hollow Hill: a haunted house on a hill under a big moon">
      <defs>
        <!-- userSpaceOnUse so the end colors extend above/below the 640-tall art on tall phones -->
        <linearGradient id="sky-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="640">
          <stop offset="0" stop-color="#0b0620"/>
          <stop offset="1" stop-color="#2a1146"/>
        </linearGradient>
        <radialGradient id="horizon-grad" cx="250" cy="340" r="230" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#7a3a9a" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#7a3a9a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="moon-glow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#f4e9b8" stop-opacity="0.35"/>
          <stop offset="1" stop-color="#f4e9b8" stop-opacity="0"/>
        </radialGradient>

        <!-- Tree geometry (no paint set here; each <use> supplies it). Lantern hangs from the long left branch. -->
        <g id="tree-shape">
          <!-- trunk with root flare -->
          <path d="M310 556 C326 552 329 540 330 522 C331 492 323 466 328 440 C331 418 327 396 331 374 C333 362 335 354 337 346 L345 348 C346 360 347 372 346 392 C345 414 349 436 346 462 C344 490 348 524 352 546 C354 552 358 555 362 556 Z"/>
          <!-- long left branch (lantern) -->
          <path d="M331 422 C310 412 285 410 258 414 C284 418 308 428 331 442 Z"/>
          <!-- upper left branch with forked twig -->
          <path d="M330 386 C318 366 304 360 286 338 C306 354 322 366 338 396 Z"/>
          <path d="M308 360 C300 352 298 346 300 334 C304 346 310 352 316 362 Z"/>
          <!-- upper right branch with twig -->
          <path d="M337 366 C340 340 344 318 350 296 C350 320 350 340 346 368 Z"/>
          <path d="M343 338 C335 328 331 320 327 308 C335 318 341 326 347 336 Z"/>
          <!-- low stub for a gnarled look -->
          <path d="M328 480 C318 468 310 462 300 454 C312 460 322 466 331 470 Z"/>
        </g>

        <radialGradient id="lantern-glow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ffc247" stop-opacity="0.55"/>
          <stop offset="1" stop-color="#ffc247" stop-opacity="0"/>
        </radialGradient>

        <!-- Sheet ghost: one reusable drawing (not placed in the scene yet; used by stories) -->
        <symbol id="ghost" viewBox="0 0 60 80">
          <path fill="#f2f0ff"
                d="M8 40 C8 14 20 4 30 4 C40 4 52 14 52 40 L52 72 Q46 80 40 72 Q34 80 28 72 Q22 80 16 72 Q10 80 8 72 Z"/>
          <ellipse fill="#f2f0ff" cx="6" cy="50" rx="6" ry="4" transform="rotate(25 6 50)"/>
          <ellipse fill="#f2f0ff" cx="54" cy="50" rx="6" ry="4" transform="rotate(-25 54 50)"/>
          <circle fill="#1a0f2e" cx="22" cy="30" r="3.5"/>
          <circle fill="#1a0f2e" cx="38" cy="30" r="3.5"/>
          <ellipse fill="#1a0f2e" cx="30" cy="42" rx="3" ry="4"/>
        </symbol>
        <!-- Party hat is separate so it is easy to change or remove -->
        <symbol id="ghost-hat" viewBox="0 0 24 28">
          <path fill="#ff7a1a" d="M12 0 L22 26 L2 26 Z"/>
          <circle fill="#ffc247" cx="12" cy="2" r="2.5"/>
        </symbol>
      </defs>

      <!-- 1. Sky: gradient, stars, horizon glow, moon -->
      <g id="layer-sky">
        <!-- Rects overshoot the viewBox (y -600 to 1240) so tall phones show sky above and ground below, not bars -->
        <rect y="-600" width="360" height="1840" fill="url(#sky-grad)"/>
        <rect y="-600" width="360" height="1840" fill="url(#horizon-grad)"/>
        <g fill="#f5ecff" opacity="0.85">
          <circle cx="48" cy="-20" r="1.2"/><circle cx="140" cy="-48" r="1"/>
          <circle cx="226" cy="-12" r="1.3"/><circle cx="310" cy="-60" r="1.1"/>
          <circle cx="90" cy="-90" r="1"/><circle cx="260" cy="-110" r="1.2"/>
          <circle cx="30" cy="40" r="1.4"/><circle cx="82" cy="96" r="1"/>
          <circle cx="130" cy="30" r="1.2"/><circle cx="176" cy="78" r="1"/>
          <circle cx="212" cy="38" r="1.5"/><circle cx="290" cy="60" r="1.1"/>
          <circle cx="332" cy="104" r="1.3"/><circle cx="60" cy="170" r="1.1"/>
          <circle cx="112" cy="140" r="0.9"/><circle cx="340" cy="190" r="1"/>
          <circle cx="20" cy="250" r="1"/><circle cx="154" cy="190" r="1"/>
        </g>
        <circle cx="240" cy="185" r="85" fill="url(#moon-glow)"/>
        <circle cx="240" cy="185" r="48" fill="#f4e9b8"/>
      </g>

      <!-- 2. Far hill + house (windows are hotspots) -->
      <g id="layer-house">
        <path fill="#1c0f33" d="M0 400 C60 380 120 352 200 346 C280 340 330 366 360 378 L360 1240 L0 1240 Z"/>
        <g fill="#0e0720">
          <path d="M172 384 L172 290 L156 294 L236 226 L252 206 L346 290 L332 288 L332 384 Z"/>
          <path d="M292 240 L311 198 L330 242 Z"/>
          <rect x="296" y="236" width="30" height="56"/>
          <rect x="190" y="232" width="14" height="32"/>
        </g>
        <rect x="238" y="338" width="24" height="46" rx="12" fill="#1c0f33"/>

        <g class="hotspot" role="button" tabindex="0" aria-label="Window 1" data-kind="window" data-id="1">
          <circle class="glow" cx="200" cy="322" r="24"/>
          <rect class="art" fill="#ffb347" x="192" y="312" width="16" height="20" rx="2"/>
          <rect class="hit" x="176" y="298" width="48" height="48" rx="8"/>
        </g>
        <g class="hotspot" role="button" tabindex="0" aria-label="Window 2" data-kind="window" data-id="2">
          <circle class="glow" cx="246" cy="258" r="24"/>
          <path class="art" fill="#ffb347" d="M237 270 L237 256 A9 9 0 0 1 255 256 L255 270 Z"/>
          <rect class="hit" x="222" y="234" width="48" height="48" rx="8"/>
        </g>
        <g class="hotspot" role="button" tabindex="0" aria-label="Window 3" data-kind="window" data-id="3">
          <circle class="glow" cx="302" cy="326" r="24"/>
          <rect class="art" fill="#ffb347" x="294" y="316" width="16" height="20" rx="2"/>
          <rect class="hit" x="278" y="302" width="48" height="48" rx="8"/>
        </g>
      </g>

      <!-- 3. Graveyard (left, tombstones are hotspots) + tree with lantern -->
      <g id="layer-graveyard">
        <path fill="#120a24" d="M0 470 C80 450 180 440 260 455 C310 462 340 458 360 450 L360 1240 L0 1240 Z"/>

        <g class="hotspot" role="button" tabindex="0" aria-label="Tombstone 1" data-kind="tombstone" data-id="1">
          <circle class="glow" cx="44" cy="482" r="30"/>
          <path class="art stone" d="M30 504 V474 A14 14 0 0 1 58 474 V504 Z"/>
          <rect class="hit" x="20" y="458" width="48" height="52" rx="8"/>
        </g>
        <g class="hotspot" role="button" tabindex="0" aria-label="Tombstone 2" data-kind="tombstone" data-id="2">
          <circle class="glow" cx="106" cy="486" r="30"/>
          <path class="art stone" d="M90 508 V480 A16 16 0 0 1 122 480 V508 Z"/>
          <path d="M106 470 V488 M99 477 H113" stroke="#6b5a8e" stroke-width="2" fill="none" stroke-linecap="round"/>
          <rect class="hit" x="82" y="460" width="48" height="52" rx="8"/>
        </g>
        <g class="hotspot" role="button" tabindex="0" aria-label="Tombstone 3" data-kind="tombstone" data-id="3">
          <circle class="glow" cx="168" cy="484" r="30"/>
          <path class="art stone" transform="rotate(7 168 506)" d="M154 506 V480 A14 14 0 0 1 182 480 V506 Z"/>
          <rect class="hit" x="144" y="460" width="48" height="52" rx="8"/>
        </g>

        <!-- Gnarled tree with hanging lantern (decor) -->
        <!-- Tree: one filled silhouette (tapered trunk and branches), drawn twice: wide rim color first,
             then dark on top, so only the outer edge shows a moonlit rim -->
        <use href="#tree-shape" fill="#6b5a8e" stroke="#6b5a8e" stroke-width="3" stroke-linejoin="round"/>
        <use href="#tree-shape" fill="#0e0720"/>
        <path d="M268 416 V431" stroke="#0e0720" stroke-width="2" fill="none"/>
        <circle cx="268" cy="441" r="30" fill="url(#lantern-glow)"/>
        <rect x="261" y="431" width="14" height="20" rx="3" fill="#ffb347" stroke="#0e0720" stroke-width="2"/>
      </g>

      <!-- 4. Pumpkin patch (foreground, pumpkins are hotspots) -->
      <g id="layer-patch">
        <path fill="#0e0720" d="M0 562 C90 546 270 546 360 562 L360 1240 L0 1240 Z"/>

        <g class="hotspot" role="button" tabindex="0" aria-label="Pumpkin 1" data-kind="pumpkin" data-id="1">
          <circle class="glow" cx="50" cy="602" r="30"/>
          <g class="art pumpkin">
            <ellipse cx="50" cy="602" rx="17" ry="13"/>
            <path class="rib" d="M43 590 C39 598 39 606 43 614 M57 590 C61 598 61 606 57 614"/>
            <rect class="stem" x="48" y="586" width="4" height="6"/>
          </g>
          <rect class="hit" x="26" y="578" width="48" height="48" rx="8"/>
        </g>
        <g class="hotspot" role="button" tabindex="0" aria-label="Pumpkin 2" data-kind="pumpkin" data-id="2">
          <circle class="glow" cx="118" cy="594" r="34"/>
          <g class="art pumpkin">
            <ellipse cx="118" cy="594" rx="22" ry="17"/>
            <path class="rib" d="M109 579 C103 589 103 599 109 609 M127 579 C133 589 133 599 127 609"/>
            <rect class="stem" x="116" y="574" width="5" height="8"/>
          </g>
          <rect class="hit" x="92" y="568" width="52" height="52" rx="8"/>
        </g>
        <g class="hotspot" role="button" tabindex="0" aria-label="Pumpkin 3" data-kind="pumpkin" data-id="3">
          <circle class="glow" cx="204" cy="600" r="40"/>
          <g class="art pumpkin">
            <ellipse cx="204" cy="600" rx="29" ry="22"/>
            <path class="rib" d="M192 580 C184 592 184 608 192 620 M216 580 C224 592 224 608 216 620"/>
            <rect class="stem" x="201" y="576" width="6" height="9"/>
          </g>
          <rect class="hit" x="174" y="572" width="60" height="56" rx="8"/>
        </g>
        <g class="hotspot" role="button" tabindex="0" aria-label="Pumpkin 4" data-kind="pumpkin" data-id="4">
          <circle class="glow" cx="294" cy="592" r="48"/>
          <g class="art pumpkin">
            <ellipse cx="294" cy="592" rx="37" ry="30"/>
            <path class="rib" d="M278 564 C266 580 266 604 278 620 M310 564 C322 580 322 604 310 620"/>
            <rect class="stem" x="291" y="560" width="7" height="11"/>
          </g>
          <rect class="hit" x="254" y="558" width="80" height="68" rx="8"/>
        </g>
      </g>

      <!-- 5-7. Empty slots reserved for later checkpoints -->
      <g id="layer-fog" data-layer="fog" pointer-events="none"></g>
      <g id="layer-particles" data-layer="particles" pointer-events="none"></g>
      <g id="layer-story" data-layer="story-overlay" pointer-events="none"></g>
    </svg>

    <!-- 8. UI layer -->
    <div class="ui">
      <button id="credits-open" class="btn btn-panel ui-credits" type="button">Credits</button>
      <button id="toggle" class="btn btn-panel ui-toggle" type="button" aria-pressed="false">Pause</button>
      <p id="hint" class="hint" aria-live="polite" hidden></p>
    </div>
  </div>

  <dialog id="credits" class="credits" aria-labelledby="credits-title">
    <h2 id="credits-title">Credits</h2>
    <p>Created by Noah Rutledge.</p>
    <p>Visuals: original, drawn in code.</p>
    <p>Sound and other assets: (placeholder) none used yet. Sources and licenses will be listed here.</p>
    <button id="credits-close" class="btn btn-primary" type="button">Close</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
